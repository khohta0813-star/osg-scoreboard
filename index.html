<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OSG LIVEスコアボード</title>
<!-- 入口のページ。コートを選んで操作画面を開く／配信用URLをコピーする。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/parts.css">
<link rel="stylesheet" href="css/control.css">
<style>
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.url{font-family:var(--f-num);font-size:14px;background:var(--navy);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;word-break:break-all;line-height:1.5}
.card h3{margin:0;font-size:22px;font-family:var(--f-num);letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="live">● LIVE</span>OSG スコアボード</h1>
  </header>

  <div class="courts" id="courts"></div>

  <section class="card">
    <h2>Other court<span>ほかのコートを開く</span></h2>
    <div class="row">
      <label>コートID（A、B、C など）<input type="text" id="cid" value="C" maxlength="20"></label>
      <button id="go">操作画面を開く</button>
    </div>
    <p class="note">URL の末尾の <b>?court=</b> の後ろがコート名です。コートごとにスコアは別々に保存されます。</p>
  </section>
</div>

<script type="module">
const box = document.getElementById('courts');
const base = location.href.replace(/\/[^/]*$/, '/');

for (const c of ['A', 'B']) {
  const sec = document.createElement('section');
  sec.className = 'card';
  sec.innerHTML = `
    <h3>COURT ${c}</h3>
    <a class="btn" href="control.html?court=${c}"><button type="button" class="go">操作画面を開く</button></a>
    <p class="note">Prism に貼る配信用URL（このURLをコピーしてウェブウィジェットに設定）</p>
    <div class="url">${base}overlay.html?court=${c}</div>
    <div class="row">
      <button type="button" data-copy="${base}overlay.html?court=${c}">配信用URLをコピー</button>
      <a class="btn" href="overlay.html?court=${c}" target="_blank" rel="noopener"><button type="button">配信用ページを確認</button></a>
    </div>`;
  box.appendChild(sec);
}

box.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  try {
    await navigator.clipboard.writeText(b.dataset.copy);
    b.textContent = 'コピーしました';
    setTimeout(() => (b.textContent = '配信用URLをコピー'), 2000);
  } catch (err) {
    b.textContent = 'コピーできませんでした（手で選んでください）';
  }
});

const open = () => {
  const v = (document.getElementById('cid').value || '').trim().toUpperCase();
  if (/^[A-Z0-9_-]{1,20}$/.test(v)) location.href = `control.html?court=${v}`;
};
document.getElementById('go').onclick = open;
document.getElementById('cid').addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
</script>
</body>
</html>
