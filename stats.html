<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OSG スコア分析</title>
<!-- 操作画面が自動で残したポイント記録を読んで集計する。書き込みはしない。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/parts.css">
<link rel="stylesheet" href="css/control.css">
<style>
.layout{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.mlist{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.mitem{text-align:left;width:100%;display:flex;flex-direction:column;gap:2px;padding:10px 12px}
.mitem small{font-weight:500;color:var(--mute);font-size:12px}
.mitem.on{background:var(--lime);color:var(--navy);border-color:var(--lime)}
.mitem.on small{color:rgba(15,31,61,.75)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;color:var(--mute);font-weight:500}
thead th{color:var(--ink);font-weight:700;border-bottom:2px solid var(--line)}
td b{font-family:var(--f-num);font-size:17px}
.big-num{font-family:var(--f-num);font-size:26px;font-weight:700}
.sum{display:flex;flex-wrap:wrap;gap:18px}
.sum div{display:flex;flex-direction:column}
.sum span{font-size:12px;color:var(--mute)}
.empty{color:var(--mute);font-size:14px;line-height:1.7}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <form id="loginForm" autocomplete="on">
    <h2>OSG スコア分析</h2>
    <p class="note">配信チームのメールアドレスとパスワードでログインしてください。</p>
    <label>メールアドレス<input type="email" id="email" autocomplete="username" required></label>
    <label>パスワード<input type="password" id="pass" autocomplete="current-password" required></label>
    <p class="err" id="loginErr"></p>
    <button class="go" type="submit" id="loginBtn">ログイン</button>
  </form>
</div>

<div class="wrap" id="app">
  <header>
    <h1>OSG スコア分析</h1>
    <div class="bar">
      <a class="btn" href="index.html"><button type="button">コート一覧へ</button></a>
      <button id="logout">ログアウト</button>
    </div>
  </header>

  <div class="layout">
    <section class="card">
      <h2>Matches<span>試合を選ぶ</span></h2>
      <div class="mlist" id="mlist"><p class="empty">読み込み中…</p></div>
    </section>

    <div id="detail"><section class="card"><p class="empty">左の一覧から試合を選んでください。</p></section></div>
  </div>
</div>

<script type="module" src="js/stats-page.js"></script>
</body>
</html>
